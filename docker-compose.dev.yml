version: '3.8'

# Development configuration with live code mounting
services:
  game:
    build: .
    container_name: escape-room-game-dev
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount entire project for live editing
      - .:/app
      - /app/__pycache__
      - ollama_cache_dev:/root/.ollama

volumes:
  ollama_cache_dev:
